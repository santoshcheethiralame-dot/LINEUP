name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The fast suite is model-free; install only what it needs (scikit-learn covers the
      # ContextCite surrogate) and let the torch-backed backend and figure tests skip.
      - run: pip install rank-bm25 scikit-learn pytest
      - run: pip install -e . --no-deps
      - run: pytest

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The model job installs the CPU torch stack and matplotlib and runs the whole suite,
      # including the slow backend tests (against a tiny model) and the figure tests, so a
      # regression in generation, scoring, or plotting turns CI red rather than shipping.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers rank-bm25 scikit-learn matplotlib pytest
      - run: pip install -e . --no-deps
      - run: pytest -o "addopts=" -m "slow or not slow"
