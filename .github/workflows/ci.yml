name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The fast suite is model-free; install only what it needs and let the
      # torch-backed backend tests skip. The model stages are exercised on a GPU
      # with `pytest -m slow`, not in CI.
      - run: pip install rank-bm25 pytest
      - run: pip install -e . --no-deps
      - run: pytest
