[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lineup"
version = "0.0.1"
description = "A controlled benchmark for organic chunk-role attribution in retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds only (the code runs on numpy 2 and scikit-learn 1.6, as CI confirms), so an
# editable install does not downgrade a hosted environment such as Colab. HotpotQA is loaded
# from its parquet-native repo, so no datasets upper bound is needed either. Exact, reproducible
# versions for a local GPU run live in requirements.txt.
dependencies = [
    "transformers>=4.45",
    "datasets>=2.18",
    "accelerate>=1.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.7",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
gpu = ["bitsandbytes>=0.46.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: tests that download a small model from the Hugging Face Hub"]
